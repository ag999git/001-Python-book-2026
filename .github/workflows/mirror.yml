name: Mirror to New Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Push to Mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # 1. Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Create a temporary branch to push
          git checkout -b mirror-branch
          
          # 3. Remove the .github folder from this branch so it doesn't get pushed
          # This prevents the "workflow scope" permission error
          rm -rf .github
          git add .
          git commit -m "Mirroring content (excluding workflows)"
          
          # 4. Add the mirror remote
          git remote add mirror https://x-access-token:${MIRROR_TOKEN}@github.com/ag999git/001-mirror.git
          
          # 5. Push this branch to the mirror repo's main branch
          git push mirror mirror-branch:main --force
