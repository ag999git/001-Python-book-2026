name: Sync to MkDocs Repo
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Primary Repository
        uses: actions/checkout@v4
        with:
          repository: ag999git/001-Python-book-2026
          path: primary-repo
          token: ${{ secrets.MIRROR_TOKEN }}
      - name: Checkout Target MkDocs Repo
        uses: actions/checkout@v4
        with:
          repository: ag999git/001-mkdocs
          path: mkdocs-repo
          token: ${{ secrets.MIRROR_TOKEN }}
      - name: Sync Folders & Clean GitBook Artifacts
        run: |
          # 1. Debug: Check that README.md exists in Primary Repo.
          #    README.md is the single source for the home page of all three
          #    surfaces: the GitHub repo landing page, the GitBook home, and
          #    (copied to docs/index.md in step 4 below) this MkDocs site.
          echo "Checking for README.md in Primary Repo:"
          ls -F primary-repo/README.md || echo "README.md NOT FOUND in primary-repo root"
          # 2. Setup folders
          mkdir -p mkdocs-repo/docs
          rm -rf mkdocs-repo/docs/*
          # 3. Copy folders
          cd primary-repo
          for folder in [0-9][0-9]-* images resources colab-nb; do
            if [ -d "$folder" ]; then
              cp -r "$folder" ../mkdocs-repo/docs/
              echo "Copied folder: $folder"
            fi
          done
          # 3a. GitBook stores images in .gitbook/assets. MkDocs excludes
          #     dot-directories from its build output, so those images never
          #     reach the site. Copy them to a plain folder name instead.
          if [ -d ".gitbook/assets" ]; then
            mkdir -p ../mkdocs-repo/docs/gitbook-assets
            cp -r .gitbook/assets/. ../mkdocs-repo/docs/gitbook-assets/
            echo "Copied .gitbook/assets -> docs/gitbook-assets"
          fi
          # 3b. Fix root-relative image paths for MkDocs project-page hosting.
          # Source markdown uses root-relative paths like "/resources/foo.png"
          # which work on GitHub's preview and on GitBook (site root = docs root),
          # but this MkDocs site is served under a subpath:
          #   https://ag999git.github.io/001-mkdocs/
          # so those links need the "/001-mkdocs" prefix to resolve correctly.
          echo "Rewriting root-relative image paths for MkDocs subpath hosting:"
          find ../mkdocs-repo/docs -name "*.md" -print0 | xargs -0 sed -i \
            -e 's#](/resources/#](/001-mkdocs/resources/#g' \
            -e 's#](/images/#](/001-mkdocs/images/#g' \
            -e 's#](\.*[./]*\.gitbook/assets/#](/001-mkdocs/gitbook-assets/#g'
          echo "Path rewrite complete."
          # 4. Use README.md as the MkDocs home page (docs/index.md).
          #    The folder loop above never copies root-level files, so without
          #    this the site would have no page at "/" and the root URL 404s.
          if [ -f "README.md" ]; then
            cp README.md ../mkdocs-repo/docs/index.md
            # Apply the same root-relative path fix as step 3b: that pass ran
            # before this file existed, so it must be repeated for this one.
            sed -i \
              -e 's#](/resources/#](/001-mkdocs/resources/#g' \
              -e 's#](/images/#](/001-mkdocs/images/#g' \
              ../mkdocs-repo/docs/index.md
            echo "Copied README.md -> mkdocs-repo/docs/index.md"
          else
            echo "WARNING: README.md not found in primary-repo root!"
          fi
          cd ..
          # 5. Final cleanup
          find mkdocs-repo/docs -iname "summary.md" -delete
          find mkdocs-repo/docs -iname "readme.md" -execdir mv {} index.md \;
          
          # 6. Final Debug: List what is currently in docs
          echo "Current content of docs folder:"
          ls -R mkdocs-repo/docs/
      # ------------------------------------------------------------------
      # Translate SUMMARY.md (GitBook's navigation file, which MkDocs cannot
      # read) into the `.pages` files used by mkdocs-awesome-pages-plugin.
      # SUMMARY.md then drives the navigation of BOTH sites.
      #
      # continue-on-error: if this step fails for any reason the sync still
      # completes and the site keeps its current automatic navigation.
      # ------------------------------------------------------------------
      - name: Generate MkDocs navigation from SUMMARY.md
        continue-on-error: true
        run: |
          python3 primary-repo/.github/scripts/gen_mkdocs_pages.py \
                  primary-repo/SUMMARY.md \
                  mkdocs-repo/docs

      - name: Commit and Push Changes
        env:
          PAT_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd mkdocs-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/ag999git/001-mkdocs.git
          
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Sync: Added index.md and updated chapters"
            git push origin main
          else
            echo "No changes detected to push."
          fi
